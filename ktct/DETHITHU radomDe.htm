B. thu lợi nhuận độc quyền.
*C. thu lợi nhuận độc quyền cao.
D. thu lợi nhuận siêu ngạch.
Gt: Tài phiệt sử dụng các thủ đoạn tài chính và đầu cơ để thu về lợi nhuận độc quyền cao (Trang 141, giáo trình Kinh tế chính trị Mác - Lênin, 2021).

Câu 2: Người bán không mất quyền sở hữu, người mua chỉ được quyền sử dụng trong một thời gian là đặc điểm của:
A. tư bản hàng hóa.
B. tư bản sản xuất.
C. tư bản thương nghiệp.
*D. tư bản cho vay.
Gt: Đặc điểm của tư bản cho vay là quyền sở hữu tách rời quyền sử dụng trong một thời hạn nhất định (Trang 118).

Câu 3: Nền kinh tế trong đó sự sản sinh ra, phổ cập và sử dụng tri thức giữ vai trò quyết định nhất đối với sự phát triển kinh tế là:
A. kinh tế tự cung tự cấp.
B. kinh tế hàng hóa.
*C. kinh tế tri thức.
D. kinh tế thị trường.
Gt: Đây là định nghĩa về nền kinh tế tri thức, lấy tri thức làm động lực chính tạo ra của cải (Trang 251).

Câu 4: Xí nghiệp A đầu tư 200.000.000 đồng, cấu tạo hữu cơ c/v = 4/1, tỷ suất m' = 100%. Vậy lượng giá trị mới là bao nhiêu?
A. 25.000.000 đồng.
B. 30.000.000 đồng.
*C. 80.000.000 đồng.
D. 40.000.000 đồng.
Gt: c+v=200tr, c=4v => v=40tr. m'=100% => m=40tr. Giá trị mới = v + m = 40tr + 40tr = 80.000.000 đồng.

Câu 5: Nhà kinh tế học Pierr Boisguillebert là đại biểu tiêu biểu của:
*A. Chủ nghĩa trọng nông.
B. Chủ nghĩa trọng thương.
C. Kinh tế chính trị cổ điển Anh.
D. Kinh tế chính trị tầm thường.
Gt: Pierr Boisguillebert cùng với Jacques Turgot là những đại biểu của chủ nghĩa trọng nông (Trang 14).

Câu 6: Mâu thuẫn giữa lao động cụ thể và lao động trừu tượng xuất hiện khi sản phẩm tạo ra không phù hợp với:
A. thói quen tiêu dùng.
*B. nhu cầu xã hội.
C. nhu cầu cá nhân.
D. thị hiếu cá nhân.
Gt: Xuất hiện khi sản phẩm không được xã hội chấp nhận hoặc hao phí lao động cá biệt cao hơn mức xã hội chấp nhận (Trang 42).

Câu 7: Cuộc khủng hoảng kinh tế nào sau đây dẫn tới hình thành các doanh nghiệp độc quyền?
A. 2008.
B. 1997.
*C. 1873.
D. 1914.
Gt: Cuộc khủng hoảng năm 1873 làm phá sản hàng loạt doanh nghiệp nhỏ, thúc đẩy quá trình tích tụ và hình thành độc quyền (Trang 127).

Câu 8: Nhà kinh tế học nào sau đây là đại biểu tiêu biểu của Chủ nghĩa trọng nông?
*A. Jacques Turgot.
B. Ricardo.
C. Montchretien.
D. Smith.
Gt: Jacques Turgot là đại diện tiêu biểu của trường phái trọng nông (Trang 14).

Câu 9: Một trong những nhân tố chủ yếu ảnh hưởng đến quy mô tích lũy tư bản là:
*A. năng suất lao động xã hội.
B. lao động cụ thể.
C. lao động trừu tượng.
D. phân công lao động xã hội.
Gt: Tăng năng suất lao động xã hội giúp tăng khối lượng giá trị thặng dư được tư bản hóa (Trang 106, 107).

Câu 10: Một trong những điều kiện để sức lao động trở thành hàng hóa là người lao động:
A. có sức lao động.
B. có sức khỏe và trí tuệ.
C. muốn bán sức lao động.
*D. được tự do về thân thể.
Gt: Hai điều kiện là tự do về thân thể và không có tư liệu sản xuất (Trang 86, 87).

Câu 11: Sự hình thành các liên kết kinh tế quốc tế và khu vực tạo ra sân chơi chung là đặc trưng của:
*A. hội nhập kinh tế quốc tế.
B. kinh tế tri thức.
C. công nghiệp hoá, hiện đại hoá.
D. kinh tế thị trường.
Gt: Hội nhập kinh tế quốc tế dẫn đến hình thành các khối liên kết và khu vực mậu dịch chung (Trang 273).

Câu 12: Giá trị hàng hoá biểu hiện mối quan hệ giữa những người sản xuất, trao đổi và là phạm trù có tính:
*A. lịch sử.
B. vĩnh viễn.
C. phổ biến.
D. đặc thù.
Gt: Giá trị hàng hóa chỉ tồn tại trong các nền kinh tế sản xuất hàng hóa, nên có tính lịch sử (Trang 39).

Câu 13: Tiết kiệm tư bản bất biến là một trong những nhân tố ảnh hưởng đến:
*A. tỷ suất lợi nhuận.
B. tỷ suất lợi tức.
C. lợi nhuận bình quân.
D. tỷ suất lợi nhuận bình quân.
Gt: Tiết kiệm c làm giảm tư bản ứng trước, từ đó làm tăng tỷ suất lợi nhuận (Trang 114).

Câu 14: Phần giá trị bù lại giá cả tư liệu sản xuất và sức lao động đã sử dụng để sản xuất ra hàng hóa gọi là:
A. tư bản bất biến.
B. tư bản khả biến.
C. chi phí hàng hóa.
*D. chi phí sản xuất.
Gt: k = c + v, dùng để bù đắp các chi phí đầu vào của nhà tư bản (Trang 111).

Câu 15: Theo luật lưu thông tiền tệ, số lượng tiền cần thiết cho lưu thông phải thống nhất với:
A. tiêu dùng.
*B. lưu thông hàng hoá.
C. nhu cầu cá nhân.
D. sản xuất.
Gt: Lượng tiền phát hành phải tương ứng với tổng giá cả hàng hóa lưu thông trên thị trường (Trang 71).

Câu 16: Tiền biến thành tư bản khi được dùng để mang lại:
A. giá trị trao đổi.
B. giá trị.
*C. giá trị thặng dư.
D. giá trị sử dụng.
Gt: Mục đích cuối cùng của vận động tư bản là tạo ra m (Trang 85, 86).

Câu 17: Xí nghiệp A chi phí tư bản 100.000.000 đồng, cấu tạo hữu cơ c/v = 7/3, m' = 50%. Vậy giá trị cũ là bao nhiêu?
A. 30.000.000 đồng.
B. 45.000.000 đồng.
C. 15.000.000 đồng.
*D. 70.000.000 đồng.
Gt: c+v=100tr, c=7/3v => 10/3v=100tr => v=30tr. Giá trị cũ là c = 100tr - 30tr = 70.000.000 đồng.

Câu 18: Trong cơ cấu của độc quyền nhà nước, nhà nước đã trở thành:
A. một doanh nghiệp độc quyền.
*B. một tập thể tư bản khổng lồ.
C. một tổ chức xã hội.
D. một nhà tư bản lớn.
Gt: Nhà nước kết hợp với các tổ chức độc quyền tư nhân để hình thành một tập thể tư bản thống trị (Trang 131).

Câu 19: Thực hiện quản trị phát triển nền kinh tế thông qua việc tạo lập môi trường kinh tế tốt nhất là vai trò của:
A. người tiêu dùng.
B. người sản xuất.
C. chủ thể trung gian.
*D. nhà nước.
Gt: Nhà nước đóng vai trò quản lý vĩ mô và kiến tạo môi trường kinh doanh (Trang 80).

Câu 20: Trong kinh tế thị trường định hướng XHCN Việt Nam, kinh tế tư nhân là một động lực:
A. quyết định.
B. chủ đạo.
*C. quan trọng.
D. cơ bản.
Gt: Kinh tế nhà nước giữ vai trò chủ đạo, kinh tế tư nhân là một động lực quan trọng của nền kinh tế (Trang 1).

Câu 21: Kiểm soát, ngăn ngừa các quan hệ lợi ích có ảnh hưởng tiêu cực đối với xã hội là vai trò của:
A. Người sản xuất.
B. Người tiêu dùng.
C. Chủ thể trung gian.
*D. Nhà nước.
Gt: Nhà nước điều tiết và giải quyết các mâu thuẫn lợi ích để đảm bảo hài hòa xã hội (Trang 214-220).

Câu 22: Quá trình hình thành sự liên kết giữa các độc quyền theo chiều dọc và ngang dẫn đến sự ra đời của:
A. syndicate và các trust.
*B. concern và các conglomerate.
C. trust và các cartel.
D. cartel và các syndicate.
Gt: Đây là các hình thức liên kết độc quyền đa ngành phát triển cao (Trang 150).

Câu 23: Quy luật kinh tế nào sau đây điều tiết quan hệ giữa bên bán và bên mua hàng hoá trên thị trường?
A. Giá trị.
*B. Cung - cầu.
C. Lưu thông tiền tệ.
D. Cạnh tranh.
Gt: Quy luật cung - cầu trực tiếp điều tiết quan hệ trao đổi giữa người bán và người mua (Trang 70).

Câu 24: Tổng tư bản công nghiệp và thương nghiệp là 1 tỷ đồng, p' ngang = 18%, lợi nhuận công nghiệp là 162 triệu. Vậy lợi nhuận thương nghiệp là:
*A. 18.000.000 đồng.
B. 14.800.000 đồng.
C. 148.000.000 đồng.
D. 180.000.000 đồng.
Gt: Tổng lợi nhuận p ngang = 1 tỷ * 18% = 180tr. Lợi nhuận thương nghiệp = 180tr - 162tr = 18.000.000 đồng.

Câu 25: Hệ thống quy tắc, luật pháp, bộ máy quản lý và cơ chế vận hành nhằm điều chỉnh hành vi kinh tế gọi là:
A. hệ thống kinh tế.
B. chế độ kinh tế.
*C. thể chế kinh tế.
D. quy luật kinh tế.
Gt: Đây là định nghĩa đầy đủ về thể chế kinh tế (Trang 187).

Câu 26: Cạnh tranh giữa các tổ chức độc quyền và các xí nghiệp ngoài độc quyền nhằm:
A. thôn tính, loại bỏ các xí nghiệp độc quyền.
B. hỗ trợ cho các xí nghiệp ngoài độc quyền phát triển.
C. mở rộng thị trường cho các xí nghiệp ngoài độc quyền.
*D. thôn tính, loại bỏ các xí nghiệp ngoài độc quyền.
Gt: Các tổ chức độc quyền dùng sức mạnh để loại bỏ các đối thủ yếu hơn (Trang 135).

Câu 27: Bản chất của tích lũy tư bản là quá trình:
A. lưu thông tiền tệ.
B. lưu thông hàng hoá.
C. tái sản xuất giản đơn.
*D. tái sản xuất mở rộng.
Gt: Tích lũy tư bản là việc biến một phần giá trị thặng dư thành tư bản phụ thêm để mở rộng sản xuất (Trang 105).

Câu 28: Sự kết hợp về nhân sự giữa tổ chức độc quyền và nhà nước được thực hiện thông qua:
A. thị trường.
B. hội đồng quản trị.
*C. các đảng phái.
D. doanh nghiệp.
Gt: Các đảng phái chính trị là cầu nối nhân sự giữa giới tài phiệt và bộ máy nhà nước (Trang 145).

Câu 29: Phát hiện ra các quy luật chi phối quan hệ lợi ích giữa con người trong sản xuất là giá trị khoa học của:
*A. Kinh tế chính trị Mác - Lênin.
B. Chủ nghĩa trọng nông.
C. Chủ nghĩa trọng thương.
D. Kinh tế chính trị tầm thường.
Gt: Đây là đóng góp khoa học to lớn của học thuyết kinh tế Mác - Lênin (Trang 26).

Câu 30: Quy luật kinh tế nào điều tiết khách quan mối quan hệ ganh đua kinh tế giữa các chủ thể?
A. Lưu thông tiền tệ.
B. Giá trị.
C. Cung - cầu.
*D. Cạnh tranh.
Gt: Cạnh tranh là quy luật thúc đẩy sự ganh đua và đào thải giữa các chủ thể (Trang 72).

Câu 31: Chức năng thực tiễn của Kinh tế chính trị Mác - Lênin giúp xây dựng hoạt động kinh tế phù hợp với:
A. xu hướng chung của thế giới.
B. sự quản lý của nhà nước.
*C. quy luật khách quan.
D. thói quen cá nhân.
Gt: Chức năng thực tiễn trang bị năng lực vận dụng đúng các quy luật khách quan vào đời sống (Trang 31).

Câu 32: Tiền trong nền sản xuất tư bản chủ nghĩa vận động theo công thức:
A. H-H-T.
*B. T-H-T'.
C. H-T-H'.
D. T-H-T.
Gt: Tư bản vận động theo trình tự Tiền - Hàng - Tiền (có giá trị lớn hơn) (Trang 85).

Câu 33: Giá trị thặng dư trong nền kinh tế thị trường tư bản chủ nghĩa mang bản chất là quan hệ:
A. trao đổi.
B. lợi ích.
C. xã hội.
*D. giai cấp.
Gt: Nó phản ánh quan hệ bóc lột giữa giai cấp tư sản và giai cấp công nhân làm thuê (Trang 98).

Câu 34: Sở dĩ hàng hoá có hai thuộc tính là do lao động của người sản xuất có tính hai mặt là:
A. giản đơn và phức tạp.
B. cụ thể và cần thiết.
C. trừu tượng và giản đơn.
*D. cụ thể và trừu tượng.
Gt: Lao động cụ thể tạo ra giá trị sử dụng, lao động trừu tượng tạo ra giá trị (Trang 40).

Câu 35: Cơ sở để so sánh, trao đổi các giá trị sử dụng khác nhau là lao động:
*A. trừu tượng.
B. phức tạp.
C. cụ thể.
D. giản đơn.
Gt: Lao động trừu tượng là sự hao phí sức lao động nói chung, là thước đo giá trị chung (Trang 41).

Câu 36: C. Mác đã kế thừa trực tiếp giá trị khoa học của học thuyết nào để phát triển lý luận về phương thức sản xuất tư bản?
A. Chủ nghĩa trọng nông.
B. Kinh tế chính trị tầm thường.
*C. Kinh tế chính trị cổ điển Anh.
D. Chủ nghĩa trọng thương.
Gt: Mác kế thừa tinh hoa của Petty, A. Smith và David Ricardo (Trang 16).

Câu 37: Mục đích nghiên cứu ở cấp độ cao nhất của kinh tế chính trị Mác - Lênin là phát hiện ra các quy luật chi phối quan hệ:
A. trao đổi hàng hóa.
B. sản xuất tư bản.
*C. giữa người với người trong sản xuất và trao đổi.
D. quản lý vĩ mô của nhà nước.
Gt: Đây là mục đích nghiên cứu bản chất các quan hệ xã hội trong kinh tế (Trang 24).

Câu 38: Mối quan hệ tỷ lệ giữa các ngành, các vùng và các thành phần kinh tế gọi là:
A. chế độ kinh tế.
B. hệ thống kinh tế.
*C. cơ cấu kinh tế.
D. thể chế kinh tế.
Gt: Cơ cấu kinh tế phản ánh cấu trúc và tỷ trọng của các bộ phận kinh tế (Trang 253).

Câu 39: Kết quả của cạnh tranh trong nội bộ ngành là hình thành:
A. giá trị sử dụng.
B. giá trị.
C. giá trị trao đổi.
*D. giá trị thị trường.
Gt: Cạnh tranh nội bộ ngành san bằng các mức hao phí lao động cá biệt thành giá trị thị trường (Trang 73).

Câu 40: Kinh tế hàng hoá hình thành khi có phân công lao động xã hội và:
A. sự phụ thuộc lẫn nhau về mặt kinh tế.
B. sự phát triển của khoa học kỹ thuật.
*C. sự tách biệt về mặt kinh tế của các chủ thể sản xuất.
D. sự phát triển của lực lượng sản xuất.
Gt: Sự tách biệt về sở hữu đòi hỏi việc trao đổi sản phẩm phải thông qua mua bán (Trang 35, 36).

C. Kinh tế chính trị tầm thường.
D. Kinh tế chính trị cổ điển Anh.

Gt: Chủ nghĩa trọng nông coi trọng nông nghiệp tuyệt đối và coi đây là ngành duy nhất tạo ra sản phẩm ròng cho xã hội.

Câu 3: C. Mác đã tạo ra được bước nhảy vọt về lý luận khoa học so với D. Ricardo khi phát hiện ra tính hai mặt của
A. hàng hoá.
B. lao động.
*C. lao động sản xuất hàng hoá.
D. kinh tế thị trường.

Gt: Phát hiện về tính hai mặt của lao động sản xuất hàng hóa (lao động cụ thể và lao động trừu tượng) là phát kiến vĩ đại đưa lý luận giá trị của C. Mác vượt lên trên D. Ricardo.

Câu 4: Các hiện tượng kinh tế đều bị chi phối bởi những lực lượng khách quan, đó là
*A. các quy luật kinh tế.
B. các chính sách kinh tế.
C. chế độ chính trị.
D. thể chế kinh tế.

Gt: Quy luật kinh tế mang tính khách quan, phản ánh những mối liên hệ bản chất, tất nhiên, lặp đi lặp lại của các hiện tượng kinh tế.

Câu 5: Chính sách kinh tế cũng tác động vào các quan hệ lợi ích, nhưng sự tác động đó mang tính
A. khách quan.
*B. chủ quan.
C. đối lập.
D. đối kháng.

Gt: Chính sách kinh tế là sản phẩm chủ quan của con người (nhà nước) dựa trên việc nhận thức và vận dụng các quy luật khách quan.

Câu 6: Cung cấp hệ thống tri thức mở về những quy luật chi phối sự phát triển của sản xuất và trao đổi gắn với phương thức sản xuất, về lịch sử phát triển các quan hệ của sản xuất và trao đổi của nhân loại nói chung là chức năng nào sau đây của kinh tế chính trị Mác - Lênin?
*A. Nhận thức.
B. Thực tiễn.
C. Tư tưởng.
D. Phương pháp luận.

Gt: Chức năng nhận thức cung cấp tri thức về các quy luật kinh tế và lịch sử phát triển của các quan hệ sản xuất, trao đổi.

Câu 7: Để nền kinh tế hàng hoá có thể hình thành và phát triển, C. Mác cho rằng cần có phân công lao động xã hội và
A. phân công lao động trừu tượng.
B. phân công lao động cụ thể.
*C. sự tách biệt về mặt kinh tế của các chủ thể sản xuất.
D. sự tách biệt tuyệt đối của các chủ thể sản xuất.

Gt: Hai điều kiện ra đời và tồn tại của sản xuất hàng hóa là phân công lao động xã hội và sự tách biệt tương đối về mặt kinh tế giữa các chủ thể sản xuất.

Câu 8: Các nhân tố ảnh hưởng đến lượng giá trị của hàng hoá bao gồm tính chất phức tạp hay giản đơn của lao động và
A. cường độ lao động.
B. năng lực lao động.
*C. năng suất lao động.
D. trình độ phát triển của lực lượng sản xuất.

Gt: Lượng giá trị của một đơn vị hàng hóa tỷ lệ nghịch với năng suất lao động và phụ thuộc vào mức độ phức tạp của lao động.

Câu 9: Lao động trừu tượng là cơ sở để so sánh, trao đổi các
*A. giá trị khác nhau.
B. giá cả khác nhau.
C. giá trị thị trường khác nhau.
D. giá trị sử dụng khác nhau.

Gt: Lao động trừu tượng tạo ra giá trị của hàng hóa và là cơ sở để so sánh, trao đổi các hàng hóa có giá trị khác nhau.

Câu 10: Trong lịch sử, sự tách biệt về mặt kinh tế giữa các chủ thể sản xuất xuất hiện khách quan dựa trên sự tách biệt về
A. tổ chức sản xuất.
*B. sở hữu.
C. quản lý sản xuất.
D. phân phối.

Gt: Sự tách biệt về mặt kinh tế giữa các chủ thể sản xuất do quan hệ sở hữu khác nhau về tư liệu sản xuất quy định.

Câu 11: Khi sản phẩm do những người sản xuất hàng hoá riêng biệt tạo ra không phù hợp với nhu cầu xã hội dẫn đến xuất hiện mâu thuẫn giữa lao động cụ thể và lao động
A. giản đơn.
B. phức tạp.
C. sản xuất hàng hoá.
*D. trừu tượng.

Gt: Khi hàng hóa không bán được, lao động cụ thể không thể chuyển hóa thành lao động trừu tượng để xã hội thừa nhận giá trị.

Câu 12: Hệ thống các quan hệ kinh tế mang đặc tính tự điều chỉnh các cân đối của nền kinh tế theo yêu cầu của các quy luật kinh tế được gọi là
A. thể chế kinh tế.
B. chế độ chính trị.
*C. cơ chế thị trường.
D. chế độ xã hội.

Gt: Cơ chế thị trường là hệ thống các quan hệ kinh tế tự điều tiết các cân đối lớn theo yêu cầu khách quan của các quy luật thị trường.

Câu 13: Quy luật cung - cầu điều tiết quan hệ giữa
*A. bên bán và bên mua hàng hoá trên thị trường.
B. các nền kinh tế.
C. những người sản xuất hàng hoá.
D. những người tiêu dùng hàng hoá.

Gt: Quy luật cung - cầu là quy luật điều tiết mối quan hệ giữa cung và cầu, tức là giữa bên bán (người sản xuất) và bên mua (người tiêu dùng) trên thị trường.

Câu 14: Quy luật cạnh tranh điều tiết một cách khách quan mối quan hệ ganh đua kinh tế giữa
A. các nền kinh tế trên thế giới.
*B. các chủ thể trong sản xuất và trao đổi hàng hoá.
C. các chế độ kinh tế.
D. các chế độ xã hội.

Gt: Cạnh tranh là sự ganh đua kinh tế giữa các chủ thể tham gia sản xuất, trao đổi nhằm thu được lợi ích tối đa.

Câu 15: Sự hình thành giá trị thị trường là kết quả của cạnh tranh
A. giữa các nền kinh tế.
B. giữa các ngành.
*C. trong nội bộ ngành.
D. trong từng doanh nghiệp.

Gt: Cạnh tranh trong nội bộ ngành tạo ra sự san bằng các mức hao phí lao động cá biệt thành hao phí lao động xã hội cần thiết, tức là hình thành giá trị thị trường.

Câu 16: Vai trò của người tiêu dùng là
*A. định hướng sản xuất.
B. quản trị phát triển nền kinh tế.
C. tăng cơ hội thực hiện giá trị của hàng hoá.
D. khắc phục các khuyết tật của nền kinh tế.

Gt: Nhu cầu tiêu dùng là mục đích của sản xuất, do đó tiêu dùng có vai trò định hướng cho các hoạt động sản xuất của xã hội.

Câu 17: Tư bản vận động theo công thức
A. H-H-T
B. T-H-T
*C. T-H-T'
D. H-T-H

Gt: Công thức chung của tư bản là T-H-T', trong đó số tiền thu về phải lớn hơn số tiền ứng ra ban đầu một lượng giá trị thặng dư.

Câu 18: Lưu thông (mua, bán thông thường) không tạo ra giá trị tăng thêm xét trên phạm vi
*A. xã hội.
B. cá nhân.
C. doanh nghiệp.
D. tư nhân.

Gt: Xét trên phạm vi toàn xã hội, lưu thông thuần túy chỉ có sự dịch chuyển quyền sở hữu của tiền và hàng chứ không làm tổng lượng giá trị tăng lên.

Câu 19: Giá trị tư liệu sinh hoạt cần thiết để tái sản xuất ra sức lao động và nuôi con của người lao động, phí tốn đào tạo người lao động là các bộ phận hợp thành của
A. giá trị hàng hoá.
*B. giá trị hàng hoá sức lao động.
C. giá trị sử dụng hàng hoá.
D. giá trị sử dụng hàng hoá sức lao động.

Gt: Giá trị hàng hóa sức lao động gồm giá trị tư liệu sinh hoạt nuôi sống bản thân người lao động, gia đình họ và chi phí đào tạo.

Câu 20: Quá trình sản xuất giá trị thặng dư là sự thống nhất của quá trình tạo ra và làm
A. tăng giá trị sử dụng.
*B. tăng giá trị.
C. giảm giá trị sử dụng.
D. giảm giá trị.

Gt: Bản chất của sản xuất tư bản chủ nghĩa là quá trình tạo ra giá trị và làm tăng giá trị (tạo ra giá trị thặng dư).

Câu 21: Xí nghiệp A trong một tháng sản xuất kinh doanh thu về tổng giá trị hàng hoá 400.000.000 đồng, trong đó giá trị mới là 80.000.000 đồng. Vậy lượng giá trị cũ là bao nhiêu?
*A. 320.000.000 đồng.
B. 250.000.000 đồng.
C. 230.000.000 đồng.
D. 340.000.000 đồng.

Gt: Giá trị hàng hóa bằng giá trị cũ tái hiện cộng giá trị mới (W = c + v + m). Lượng giá trị cũ bằng 400.000.000 - 80.000.000 = 320.000.000 đồng.

Câu 22: Quá trình sản xuất liên tục được lặp đi lặp lại không ngừng gọi là
*A. tái sản xuất.
B. sản xuất giản đơn.
C. sản xuất mở rộng.
D. sản xuất.

Gt: Tái sản xuất là quá trình sản xuất được lặp đi lặp lại và đổi mới không ngừng.

Câu 23: Một trong những nhân tố chủ yếu ảnh hưởng đến quy mô tích lũy tư bản là
A. sử dụng máy móc.
*B. sử dụng hiệu quả máy móc.
C. máy móc.
D. hạn chế sử dụng máy móc.

Gt: Nâng cao hiệu quả sử dụng máy móc, thiết bị (chênh lệch giữa tư bản sử dụng và tư bản tiêu dùng) là nhân tố giúp tăng quy mô tích lũy.

Câu 24: Xí nghiệp A có lượng tư bản đầu tư 200.000.000 đồng, cấu tạo hữu cơ của tư bản 4/1, tỷ suất giá trị thặng dư 100%, giá trị thặng dư tư bản hoá 70%. Vậy lượng giá trị thặng dư dành cho tiêu dùng là bao nhiêu?
*A. 12.000.000 đồng.
B. 20.000.000 đồng.
C. 60.000.000 đồng.
D. 28.000.000 đồng.

Gt: Tư bản khả biến v = 200tr / 5 = 40tr. Do m' = 100% nên m = 40tr. Lượng m dành cho tích lũy (tư bản hóa) là 70%, suy ra lượng m dành cho tiêu dùng là 30% x 40tr = 12.000.000 đồng.

Câu 25: Lợi nhuận là phần thưởng cho việc gánh chịu rủi ro và cho sự đổi mới là quan niệm của nhà tư tưởng nào sau đây?
A. C. Mác.
B. Ph. Ăngghen.
C. V.I. Lênin.
*D. P. Samuelson.

Gt: Paul Samuelson cho rằng lợi nhuận xuất hiện như một phần thưởng cho hoạt động quản lý, đổi mới và chấp nhận rủi ro kinh doanh.

Câu 26: Lợi nhuận thương nghiệp thực chất là một phần của
A. giá trị hàng hoá.
B. giá trị trao đổi.
*C. giá trị thặng dư.
D. giá trị sử dụng.

Gt: Lợi nhuận thương nghiệp có nguồn gốc từ một phần giá trị thặng dư tạo ra trong sản xuất do nhà tư bản công nghiệp nhượng lại.

Câu 27: Giá cả của tư bản cho vay được quyết định bởi
*A. giá trị sử dụng của tư bản.
B. giá trị của tư bản.
C. giá trị trao đổi của tư bản.
D. giá trị cũ của tư bản.

Gt: Giá cả của tư bản cho vay (lợi tức) không do giá trị quyết định mà do giá trị sử dụng đặc biệt của nó (khả năng tạo ra lợi nhuận) quy định.

Câu 28: Với tỷ suất lợi tức cho vay 3% một tháng, ông A trả lợi tức cho ông B một tháng 6.000.000 đồng. Vậy ông B cho ông A vay với số tiền là bao nhiêu?
A. 600.000.000 đồng.
*B. 200.000.000 đồng.
C. 300.000.000 đồng.
D. 400.000.000 đồng.

Gt: Số tiền cho vay bằng số tiền lợi tức chia cho tỷ suất lợi tức: 6.000.000 / 3% = 200.000.000 đồng.

Câu 29: Một trong những nguyên nhân hình thành độc quyền nhà nước trong nền kinh tế thị trường tư bản chủ nghĩa là do
A. sự phát triển của hệ thống tín dụng.
B. sự cạnh tranh gay gắt.
*C. tích tụ và tập trung vốn lớn.
D. sự tác động của các quy luật kinh tế thị trường.

Gt: Tích tụ và tập trung sản xuất, tích tụ tập trung vốn ngày càng lớn dẫn đến độc quyền tư nhân, từ đó thúc đẩy độc quyền nhà nước ra đời để điều tiết các mâu thuẫn.

Câu 30: Để thu lợi nhuận độc quyền cao, các tổ chức độc quyền ấn định giá cả
*A. độc quyền mua và độc quyền bán.
B. hàng hoá.
C. độc quyền sản xuất hàng hoá.
D. thị trường.

Gt: Tổ chức độc quyền thao túng thị trường bằng cách áp đặt giá cả độc quyền mua (thấp) đối với nguyên liệu và giá cả độc quyền bán (cao) đối với sản phẩm.

Câu 31: Sự phát triển của hệ thống tín dụng trở thành đòn bẩy thúc đẩy tập trung sản xuất, tạo tiền đề cho sự ra đời của các tổ chức độc quyền, nhất là việc hình thành và phát triển các
A. doanh nghiệp vừa và nhỏ.
*B. công ty cổ phần.
C. công ty liên doanh.
D. doanh nghiệp nhà nước.

Gt: Hệ thống tín dụng thúc đẩy quá trình liên kết tư bản, tạo điều kiện mạnh mẽ cho việc hình thành các công ty cổ phần quy mô khổng lồ.

Câu 32: Quá trình độc quyền hóa trong công nghiệp và ngân hàng có quan hệ chặt chẽ với nhau làm nảy sinh một loại hình tư bản mới, gọi là
A. tư bản công nghiệp.
B. tư bản cho vay.
C. tư bản ngân hàng.
*D. tư bản tài chính.

Gt: Tư bản tài chính là kết quả của sự dung hợp giữa tư bản độc quyền ngân hàng và tư bản độc quyền công nghiệp.

Câu 33: Làm chỗ dựa cho sự điều tiết kinh tế của nhà nước theo những chương trình nhất định là một trong những chức năng cơ bản của
A. nhà nước.
B. tổ chức độc quyền.
C. sở hữu độc quyền tư nhân.
*D. sở hữu nhà nước.

Gt: Sở hữu nhà nước (kinh tế nhà nước) là công cụ kinh tế cốt lõi giúp nhà nước tư sản điều tiết vĩ mô toàn bộ nền kinh tế theo định hướng.

Câu 34: Trong điều kiện ngày nay, xu hướng vận động của các tổ chức độc quyền là trở thành các
A. nước đế quốc.
*B. công ty xuyên quốc gia.
C. doanh nghiệp nhà nước.
D. tổ chức xã hội.

Gt: Xu hướng toàn cầu hóa buộc các tổ chức độc quyền lớn phải bành trướng ra phạm vi quốc tế dưới mô hình các tập đoàn, công ty xuyên quốc gia (TNCs).

Câu 35: Nền kinh tế mà Đảng và nhân dân Việt Nam đang xây dựng là nền kinh tế
A. thị trường xã hội chủ nghĩa.
*B. thị trường định hướng xã hội chủ nghĩa.
C. thị trường tự do.
D. thị trường hiện đại.

Gt: Việt Nam đang kiên trì mục tiêu xây dựng nền kinh tế thị trường định hướng xã hội chủ nghĩa nhằm bảo đảm tăng trưởng gắn liền tiến bộ xã hội.

Câu 36: Trong quá trình xây dựng nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam, kinh tế nhà nước và kinh tế tập thể ngày càng
A. giữ vai trò chủ đạo trong nền kinh tế quốc dân.
*B. trở thành nền tảng vững chắc trong nền kinh tế quốc dân.
C. giữ vai trò quan trọng trong nền kinh tế quốc dân.
D. giữ vai trò quyết định trong nền kinh tế quốc dân.

Gt: Kinh tế nhà nước đóng vai trò chủ đạo, kết hợp với kinh tế tập thể tạo thành nền tảng vững chắc của nền kinh tế quốc dân Việt Nam.

Câu 25: Theo quan điểm của P.Samuelson, lợi nhuận là phần thu nhập thặng dư tính bằng hiệu quả giữa tổng doanh thu trừ đi
A. tổng giá trị hàng hoá.
*B. tổng chi phí.
C. giá trị hàng hoá.
D. giá trị tăng thêm.

Gt: Theo P.Samuelson, lợi nhuận = Tổng doanh thu - Tổng chi phí (bao gồm cả chi phí cơ hội). Đây là cách tiếp cận của kinh tế học hiện đại.

Câu 26: Tỷ suất lợi nhuận phản ánh mức doanh lợi
A. trao đổi hàng hoá.
B. tiêu dùng hàng hoá.
*C. đầu tư tư bản.
D. cho vay tư bản.

Gt: Tỷ suất lợi nhuận (p' = m/K x 100%) phản ánh mức doanh lợi của đầu tư tư bản, cho biết cứ 100 đơn vị tư bản đầu tư thu được bao nhiêu đơn vị lợi nhuận.

Câu 27: Địa tô là một trong những căn cứ để tính toán giá cả ruộng đất khi thực hiện bán
A. quyền sử dụng đất.
B. quyền sở hữu đất.
*C. đất đai.
D. hàng hoá.

Gt: Giá cả ruộng đất = Địa tô / Tỷ suất lợi tức ngân hàng. Địa tô là căn cứ chính để xác định giá cả đất đai khi mua bán.

Câu 28: Mảnh đất có diện tích 100m2, giá cả mảnh đất 2 tỷ đồng, tỷ suất ngân hàng nhận gửi hiện hành 7%. Vậy địa tô của mảnh đất là bao nhiêu?
*A. 140.000.000 đồng.
B. 120.000.000 đồng.
C. 130.000.000 đồng.
D. 170.000.000 đồng.

Gt: Địa tô = Giá cả đất x Tỷ suất lợi tức = 2.000.000.000 x 7% = 140.000.000 đồng.

Câu 29: Trong nền kinh tế thị trường, độc quyền có thể được hình thành một cách tự nhiên, cũng có thể được hình thành bởi
A. điều kiện tự nhiên.
B. điều kiện xã hội.
*C. ý chí của nhà nước.
D. tư bản thương nghiệp.

Gt: Độc quyền hình thành theo hai con đường: tự nhiên (do cạnh tranh, tích tụ tập trung tư bản) hoặc do ý chí của nhà nước (nhà nước cấp phép độc quyền, bảo hộ).

Câu 30: Độc quyền có thể làm tăng năng suất lao động, nâng cao năng lực cạnh tranh của
*A. tổ chức độc quyền.
B. tổ chức chính trị.
C. nhà nước.
D. tổ chức xã hội.

Gt: Tổ chức độc quyền với ưu thế về quy mô, vốn, công nghệ có thể đầu tư R&D, nâng cao năng suất và năng lực cạnh tranh của chính tổ chức đó trên thị trường quốc tế.

Câu 31: Tổ chức độc quyền có ưu thế tập trung được sức mạnh kinh tế to lớn, nhất là sức mạnh về
A. đất đai.
B. thị trường.
C. xuất khẩu.
*D. tài chính.

Gt: Tổ chức độc quyền tập trung sức mạnh kinh tế to lớn, đặc biệt là sức mạnh tài chính (vốn, tín dụng, ngân hàng), tạo nền tảng chi phối toàn bộ nền kinh tế.

Câu 32: Sự kết hợp về nhân sự trong độc quyền nhà nước được thực hiện thông qua các đảng phái. Đứng sau các đảng phái là một lực lượng có quyền lực, đó chính là
A. các cơ quan quản lý nhà nước về kinh tế.
B. nhà tư bản kếch xù.
*C. các hội chủ xí nghiệp độc quyền.
D. nhà tài phiệt.

Gt: Đứng sau các đảng phái chính trị là các hội chủ xí nghiệp độc quyền - lực lượng tài trợ và chi phối hoạt động chính trị nhằm bảo vệ lợi ích của tư bản độc quyền.

Câu 33: Các tổ chức độc quyền công nghiệp tham gia vào công việc của ngân hàng bằng cách
A. bán tài sản cho các ngân hàng lớn.
*B. mua cổ phần của các ngân hàng lớn.
C. bán cổ phần cho các ngân hàng lớn.
D. cử đại diện tham gia vào cơ quan quản lý nhà nước.

Gt: Tổ chức độc quyền công nghiệp tham gia vào hoạt động ngân hàng bằng cách mua cổ phần của các ngân hàng lớn, từ đó kiểm soát và chi phối hoạt động ngân hàng.

Câu 34: Trong chủ nghĩa tư bản hiện đại, để cùng tồn tại và cùng phân chia quyền lực giữa các thế lực tư bản độc quyền, tại các nước tư bản phát triển nhất, quan hệ nhân sự xuất hiện cơ chế sau đây?
A. Thỏa hiệp.
B. Tham dự.
*C. Ủy nhiệm.
D. Phân cấp.

Gt: Cơ chế ủy nhiệm (hay ủy quyền) xuất hiện trong CNTB hiện đại, cho phép các thế lực tư bản độc quyền cùng tồn tại và phân chia quyền lực thông qua việc ủy nhiệm đại diện quản lý.

Câu 35: Thành phần kinh tế nào sau đây được xác định là một động lực quan trọng của nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam hiện nay?
A. Kinh tế nhà nước.
B. Kinh tế tập thể.
*C. Kinh tế tư nhân.
D. Kinh tế có vốn đầu tư nước ngoài.

Gt: Theo Nghị quyết Đại hội XIII của Đảng, kinh tế tư nhân được xác định là một động lực quan trọng của nền kinh tế thị trường định hướng XHCN ở Việt Nam.

Câu 36: Luận giải nào sau đây không đúng về tính tất yếu khách quan của việc phát triển kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam?
A. Phát triển kinh tế thị trường định hướng xã hội chủ nghĩa là phù hợp với xu hướng phát triển khách quan của Việt Nam trong bối cảnh thế giới hiện nay.
B. Do tính ưu việt của kinh tế thị trường trong thúc đẩy phát triển Việt Nam theo định hướng xã hội chủ nghĩa.
C. Kinh tế thị trường định hướng xã hội chủ nghĩa phù hợp với nguyện vọng, mong muốn của nhân dân Việt Nam.
*D. Kinh tế thị trường là mục tiêu của chủ nghĩa xã hội.

Gt: Kinh tế thị trường không phải là mục tiêu mà là phương tiện, công cụ để xây dựng CNXH. Mục tiêu của CNXH là "dân giàu, nước mạnh, dân chủ, công bằng, văn minh". Đây là luận giải không đúng.

Câu 37: Nội dung nào sau đây không phản ánh đặc trưng của kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam?
A. Kinh tế thị trường định hướng xã hội chủ nghĩa hướng tới thực hiện mục tiêu "dân giàu, nước mạnh, dân chủ, công bằng, văn minh".
B. Kinh tế thị trường định hướng xã hội chủ nghĩa là nền kinh tế có nhiều hình thức sở hữu, nhiều thành phần kinh tế, trong đó kinh tế nhà nước giữ vai trò chủ đạo.
C. Kinh tế thị trường định hướng xã hội chủ nghĩa gắn tăng trưởng kinh tế với công bằng xã hội.
*D. Kinh tế thị trường định hướng xã hội chủ nghĩa xây dựng trên nền tảng sở hữu tư nhân về tư liệu sản xuất.

Gt: KTTT định hướng XHCN ở Việt Nam xây dựng trên nền tảng sở hữu toàn dân (đất đai, tài nguyên) và sở hữu nhà nước đóng vai trò chủ đạo, không phải nền tảng sở hữu tư nhân như CNTB. Đây là nội dung không phản ánh đặc trưng.

Câu 38: Mục tiêu của công nghiệp hoá, hiện đại hoá nền kinh tế quốc dân ở Việt Nam là nhằm xây dựng
A. kinh tế thị trường.
*B. chủ nghĩa xã hội.
C. kinh tế tri thức.
D. đội ngũ tri thức.

Gt: CNH, HĐH ở Việt Nam nhằm mục tiêu tổng quát là xây dựng chủ nghĩa xã hội - tạo nền tảng vật chất kỹ thuật cho chế độ xã hội chủ nghĩa.

Câu 39: Cách mạng công nghiệp lần thứ tư làm thay đổi hệ thống sản xuất, chuyển sản xuất từ
A. tập trung sang độc quyền.
B. cạnh tranh sang độc quyền.
C. phân cấp sang tập trung.
*D. tập trung sang phân cấp.

Gt: Cách mạng công nghiệp lần thứ tư (với AI, IoT, in 3D...) cho phép sản xuất linh hoạt, phi tập trung hoá, chuyển từ mô hình sản xuất tập trung sang phân cấp (sản xuất phân tán, cá nhân hoá).

Câu 40: Chủ thể làm lực lượng nòng cốt của hội nhập quốc tế là
A. các cơ quan quản lý nhà nước.
*B. đội ngũ trí thức.
C. giai cấp công nhân.
D. doanh nghiệp và đội ngũ doanh nhân.

Gt: Đội ngũ trí thức là lực lượng nòng cốt trong hội nhập quốc tế, có vai trò tiên phong trong tiếp thu, ứng dụng khoa học công nghệ và tri thức toàn cầu vào phát triển đất nước.
`
        }
];

let exam=[], submitted=false, timeLeft=3600, timerID=null, answered=0;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function parse(text, src){
    return text.trim().split(/(?=Câu \d+:)/).filter(b=>b.trim()).map(block=>{
        const lines=block.trim().split('\n');
        const q=lines[0].replace(/Câu \d+:\s*/,'').trim();
        const opts=[]; let ci=-1, ex='';
        lines.forEach(l=>{
            l=l.trim();
            if(/^[*]?[A-D]\./.test(l)){if(l.startsWith('*'))ci=opts.length;opts.push(l.replace('*','').replace(/^[A-D]\.\s*/,'').trim())}
            else if(l.startsWith('Gt:'))ex=l.replace('Gt:','').trim();
        });
        if(!q||opts.length<2||ci===-1)return null;
        return{q,opts,ci,ex,src};
    }).filter(Boolean);
}

function getPool(){
    const v=document.getElementById('sel-src').value;
    let pool=[];
    if(v==='all') database.forEach(p=>pool=pool.concat(parse(p.content,p.name)));
    else{const p=database[+v];pool=parse(p.content,p.name)}
    return pool;
}

function updateStat(){
    const n=getPool().length;
    document.getElementById('stat-badge').textContent=n+' câu trong NHCH';
}

function generateExam(){
    const n=Math.min(+document.getElementById('sel-num').value||60, 9999);
    const mins=+document.getElementById('sel-time').value||60;
    let pool=getPool(); shuffle(pool);
    exam=pool.slice(0,Math.min(n,pool.length));
    submitted=false; answered=0;
    clearInterval(timerID);
    timeLeft=mins*60;
    updateTimerDisp();
    document.getElementById('timer-wrap').classList.remove('warn');
    timerID=setInterval(()=>{
        if(submitted)return;
        timeLeft--;updateTimerDisp();
        if(timeLeft<=300)document.getElementById('timer-wrap').classList.add('warn');
        if(timeLeft<=0)submitExam();
    },1000);
    render();
}

function updateTimerDisp(){
    const m=String(Math.floor(timeLeft/60)).padStart(2,'0');
    const s=String(timeLeft%60).padStart(2,'0');
    document.getElementById('timer-disp').textContent=m+':'+s;
}

function render(){
    const qc=document.getElementById('q-container'), ng=document.getElementById('nav-grid');
    qc.innerHTML=''; ng.innerHTML='';
    exam.forEach((q,i)=>{
        const card=document.createElement('div'); card.className='q-card'; card.id='q-'+i;
        card.innerHTML=`
            <div class="q-num">Câu ${i+1} / ${exam.length}</div>
            <div class="q-src"><i class="fa-solid fa-tag"></i> ${q.src}</div>
            <div style="font-size:1.05rem">${q.q}</div>
            <div class="opts">${q.opts.map((o,oi)=>`
                <label class="opt" id="L-${i}-${oi}">
                    <input type="radio" name="q${i}" value="${oi}" onchange="markAns(${i})">
                    <div class="opt-l">${String.fromCharCode(65+oi)}</div>
                    <div class="opt-t">${o}</div>
                </label>`).join('')}
            </div>
            <div class="ex-box" id="ex-${i}"><b><i class="fa-solid fa-lightbulb" style="color:#f59e0b"></i> Giải thích:</b><br>${q.ex||'Không có giải thích.'}</div>`;
        qc.appendChild(card);
        const btn=document.createElement('div');
        btn.className='nav-btn'; btn.id='nav-'+i; btn.textContent=i+1;
        btn.onclick=()=>card.scrollIntoView({behavior:'smooth',block:'start'});
        ng.appendChild(btn);
    });
    updateProg();
    if(window.renderMathInElement) renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}]});
}

function markAns(i){
    if(submitted)return;
    const btn=document.getElementById('nav-'+i);
    if(!btn.classList.contains('answered')){btn.classList.add('answered');answered++;updateProg()}
}

function updateProg(){
    const t=exam.length;
    document.getElementById('prog-text').textContent=answered+' / '+t+' câu đã trả lời';
    document.getElementById('prog-bar').style.width=(t>0?answered/t*100:0)+'%';
}

function submitExam(){
    if(submitted)return;
    if(!confirm('Bạn có chắc chắn muốn nộp bài?'))return;
    submitted=true; clearInterval(timerID);
    let ok=0,bad=0,skip=0;
    exam.forEach((q,i)=>{
        const sel=document.querySelector(`input[name="q${i}"]:checked`);
        document.getElementById('ex-'+i).classList.add('show');
        document.getElementById('L-'+i+'-'+q.ci).classList.add('ok');
        const nav=document.getElementById('nav-'+i);
        if(sel){
            const v=+sel.value;
            if(v===q.ci){ok++;nav.className='nav-btn correct'}
            else{bad++;nav.className='nav-btn wrong';document.getElementById('L-'+i+'-'+v).classList.add('bad')}
        } else{skip++;nav.className='nav-btn wrong'}
    });
    const t=exam.length, score=(ok/t*10).toFixed(1), pct=(ok/t*100).toFixed(0);
    document.getElementById('final-score').textContent=score;
    document.getElementById('r-ok').textContent=ok;
    document.getElementById('r-bad').textContent=bad;
    document.getElementById('r-skip').textContent=skip;
    document.getElementById('r-text').textContent='Đúng '+ok+'/'+t+' câu ('+pct+'%)';
    const color=ok/t>=0.5?'var(--blue)':'var(--bad)';
    document.getElementById('score-ring').style.background=`conic-gradient(${color} ${pct}%,#e5e7eb ${pct}%)`;
    document.getElementById('final-score').style.color=color;
    document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'})}
function reloadExam(){document.getElementById('modal').classList.remove('open');generateExam();window.scrollTo({top:0,behavior:'smooth'})}

document.getElementById('sel-src').addEventListener('change',updateStat);
window.onload=()=>{updateStat();generateExam()};
</script>
