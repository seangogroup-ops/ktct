<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn Tập KTCT Mác - SNG EDU</title>
<style>
  @font-face {
    font-family: "Fraunces";
    src: local("Georgia");
  }

  :root {
    --ink: #1c2a3a;
    --paper: #eef0f0;
    --line: #d8dade;
    --accent: #8a1f2d;
    --accent-dim: #6e1824;
    --gold: #b08a3e;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(138,31,45,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(176,138,62,0.08), transparent 45%),
      repeating-linear-gradient(0deg, rgba(28,42,58,0.025) 0px, rgba(28,42,58,0.025) 1px, transparent 1px, transparent 3px);
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 460px;
    background: #fffdfa;
    border: 1px solid var(--line);
    padding: 56px 44px 44px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(28,42,58,0.04), 0 24px 48px -20px rgba(28,42,58,0.22);
  }

  .card::before {
    content: "";
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 1px solid rgba(176,138,62,0.35);
    pointer-events: none;
  }

  .seal {
    width: 40px;
    height: 40px;
    margin: 0 auto 22px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--gold);
  }

  .mark {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 16px;
  }

  h1 {
    font-size: 28px;
    line-height: 1.35;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0 0 16px;
  }

  p {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 14.5px;
    line-height: 1.65;
    color: #5b6472;
    margin: 0 0 34px;
  }

  a.btn {
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 13.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 15px 36px;
    border: 1px solid var(--accent);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }

  a.btn:hover {
    background: var(--accent-dim);
    border-color: var(--accent-dim);
    transform: translateY(-1px);
  }

  a.btn:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 36px 0 20px;
    width: 48px;
    margin-left: auto;
    margin-right: auto;
  }

  .foot {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a1a8b2;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="seal">SE</div>
    <p class="mark">SNG EDU</p>
    <h1>Ôn Tập KTCT Mác</h1>
    <p>Vui lòng truy cập link để tiếp tục.</p>
    <a class="btn" href="https://sngshop.site/">Truy cập ngay</a>
    <hr>
    <p class="foot">sngshop.site</p>
  </div>
</body>
</html>
